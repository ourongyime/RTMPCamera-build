name: Build RTMPCamera

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装编译工具
        run: |
          brew install make ldid xz

      - name: 设置 Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: 设置 SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV
          mkdir -p /opt/theos/sdks
          ln -sf "$SDK_PATH" "/opt/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: 编译 deb 包
        run: |
          export THEOS=/opt/theos
          export SDKVERSION=$SDK_VERSION
          make package FINALPACKAGE=1

      - name: 上传 deb 包 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RTMPCamera-deb
          path: packages/*.deb

      - name: 上传到 APT 源站
        run: |
          DEB_FILE=$(ls packages/*.deb | head -1)
          echo "上传: $DEB_FILE"
          curl -s -F "file=@$DEB_FILE" http://apt.chizicn.com/upload.php || echo "HTTP上传失败,尝试FTP..."
          # FTP 备用
          curl -s -T "$DEB_FILE" ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || echo "FTP上传失败"
