name: Build RTMPCamera (Linux Cross-Compile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang git make perl curl xz-utils dpkg-dev fakeroot libplist-dev libssl-dev

      - name: Build ldid
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid --depth 1
          cd /tmp/ldid
          make -j$(nproc)
          sudo cp ldid /usr/local/bin/
          ldid --version || file /usr/local/bin/ldid

      - name: Setup Theos on Linux
        run: |
          THEOS_DIR="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR" --depth 1 2>/dev/null || true
          echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV
          mkdir -p "$THEOS_DIR/sdks"

      - name: Download iOS SDK
        run: |
          SDK_URL="https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          curl -fsSL --retry 3 -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks/
          ls -la $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export SDKVERSION=16.5
          export TARGET=iphone:clang:16.5:16.0
          find . -name "Makefile" -type f -exec sed -i "s/iphone:clang:[0-9.]*:[0-9.]*/iphone:clang:16.5:16.0/g" {} +
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTMPCamera-deb
          path: "**/*.deb"
          if-no-files-found: error
          retention-days: 90

      - name: 上传到 APT 源站
        if: success()
        run: |
          DEB_FILE=$(find . -name "*.deb" -type f | head -1)
          echo "=== 上传 $DEB_FILE ==="
          for i in 1 2 3; do
            echo "HTTP 尝试 $i/3..."
            RESULT=$(curl -s --connect-timeout 30 --max-time 120 -w "%{http_code}" -F "pwd=admin123" -F "deb_file=@$DEB_FILE" http://apt.chizicn.com/upload.php)
            if echo "$RESULT" | grep -q "RTMPCamera"; then echo "HTTP 上传成功"; break; fi
            sleep 10
          done
          curl -s --retry 3 --connect-timeout 30 -T "$DEB_FILE" ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || true
          echo "=== 上传完成 ==="
