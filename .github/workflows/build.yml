name: Build RTMPCamera

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos and Build
        run: |
          set -e
          brew install make ldid xz 2>/dev/null || true
          export PATH="/usr/local/opt/make/libexec/gnubin:$PATH"

          sudo xcode-select -s /Applications/Xcode_15.2.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          xcode-select -p

          THEOS_DIR="$HOME/theos"
          if [ ! -d "$THEOS_DIR" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR" 2>/dev/null || \
            git clone --recursive https://hub.fastgit.xyz/theos/theos.git "$THEOS_DIR" 2>/dev/null || \
            git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR"
          fi
          export THEOS="$THEOS_DIR"
          mkdir -p "$THEOS_DIR/sdks"

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          [ -z "$SDK_PATH" ] && { echo "ERROR: No SDK"; exit 1; }

          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK: $SDK_VER at $SDK_PATH"
          ln -sf "$SDK_PATH" "$THEOS_DIR/sdks/iPhoneOS${SDK_VER}.sdk"

          find . -name "Makefile" -type f -exec sed -i '' "s/iphone:clang:[0-9.]*:[0-9.]*/iphone:clang:${SDK_VER}:16.0/g" {} +

          make clean 2>/dev/null || true
          make package FINALPACKAGE=1

          echo "=== Generated .deb ==="
          find . -name "*.deb" -type f -ls

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTMPCamera-deb
          path: "**/*.deb"
          if-no-files-found: error
          retention-days: 90

      - name: 上传到 APT 源站
        if: success()
        run: |
          DEB_FILE=$(find . -name "*.deb" -type f | head -1)
          echo "=== 上传 $DEB_FILE ==="
          for i in 1 2 3; do
            echo "HTTP 尝试 $i/3..."
            RESULT=$(curl -s -w "%{http_code}" -F "pwd=admin123" -F "deb_file=@$DEB_FILE" http://apt.chizicn.com/upload.php)
            if echo "$RESULT" | grep -q "RTMPCamera"; then echo "HTTP 上传成功"; break; fi
            sleep 5
          done
          curl -s --retry 2 -T "$DEB_FILE" ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || true
          echo "=== 上传完成 ==="
