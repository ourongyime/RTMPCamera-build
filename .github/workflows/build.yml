name: Build RTMPCamera

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装编译工具
        run: |
          brew install make ldid xz

      - name: 设置 Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: 设置 SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV
          mkdir -p /opt/theos/sdks
          ln -sf "$SDK_PATH" "/opt/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: 编译 deb 包
        run: |
          export THEOS=/opt/theos
          export SDKVERSION=$SDK_VERSION
          make package FINALPACKAGE=1

      - name: 上传 deb 到 APT 源站
        run: |
          DEB_FILE=$(ls packages/*.deb | head -1)
          echo "=== 上传 $DEB_FILE 到 apt.chizicn.com ==="
          # 带重试的 HTTP 上传
          for i in 1 2 3; do
            echo "尝试 $i/3..."
            RESULT=$(curl -s -w "%{http_code}" -F "pwd=admin123" -F "deb_file=@$DEB_FILE" http://apt.chizicn.com/upload.php)
            if echo "$RESULT" | grep -q "com.rtmpcamera"; then
              echo "HTTP上传成功 (包含RTMPCamera)"
              break
            fi
            sleep 5
          done
          # FTP 备用
          echo "=== FTP 备用上传 ==="
          curl -s --retry 3 --retry-delay 5 -T "$DEB_FILE" ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || true
          echo "=== 上传完成 ==="

      - name: 保存 deb 包 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RTMPCamera-deb
          path: packages/*.deb
