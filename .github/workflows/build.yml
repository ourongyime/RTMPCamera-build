name: Build RTMPCamera

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          THEOS_DIR="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR" --depth 1 2>/dev/null || true
          echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV
          mkdir -p "$THEOS_DIR/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          curl -fsSL --retry 3 -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xf /tmp/sdk.tar.xz -C $THEOS_DIR/sdks/
          ls -la $THEOS_DIR/sdks/

      - name: Install ldid
        run: brew install ldid 2>/dev/null || echo "ldid already installed"

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export SDKVERSION=16.5
          chmod 755 layout/DEBIAN/* 2>/dev/null || true
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTMPCamera-deb
          path: "packages/*.deb"
          if-no-files-found: error
          retention-days: 90

      - name: Upload to APT Source
        if: success()
        run: |
          DEB_FILE=$(find packages/ -name "com.rtmpcamera.camera_*_iphoneos-arm64.deb" -type f | sort -r | head -1)
          echo "=== Upload $DEB_FILE ==="
          for i in 1 2 3; do
            echo "HTTP attempt $i/3..."
            RESULT=$(curl -s --connect-timeout 30 --max-time 120 -w "%{http_code}" -F "pwd=admin123" -F "deb_file=@$DEB_FILE" http://apt.chizicn.com/upload.php)
            if echo "$RESULT" | grep -q "RTMPCamera"; then echo "HTTP upload OK"; break; fi
            sleep 10
          done
          curl -s --retry 3 --connect-timeout 30 -T "$DEB_FILE" ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || true
          echo "=== Upload done ==="

      - name: Generate and Upload Packages
        run: |
          echo "Generating APT Packages file..."
          DEB_FILE=$(find packages/ -name "com.rtmpcamera.camera_*_iphoneos-arm64.deb" -type f | sort -r | head -1)
          DEB_NAME=$(basename "$DEB_FILE")
          DEB_SIZE=$(stat -f%z "$DEB_FILE" 2>/dev/null || wc -c < "$DEB_FILE" | tr -d ' ')
          DEB_MD5=$(md5 -q "$DEB_FILE" 2>/dev/null || md5sum "$DEB_FILE" | cut -d' ' -f1)
          DEB_SHA256=$(shasum -a 256 "$DEB_FILE" | cut -d' ' -f1)
          VERSION=$(cat VERSION)
          cat > /tmp/Packages << PKGEOF
Package: com.rtmpcamera.camera
Name: RTMPCamera
Version: ${VERSION}
Architecture: iphoneos-arm64
Depends: firmware (>= 16.0), ellekit
Filename: debs/${DEB_NAME}
Size: ${DEB_SIZE}
MD5sum: ${DEB_MD5}
SHA256: ${DEB_SHA256}
Description: iOS Virtual Camera v${VERSION}
Maintainer: ourongyime <9450915@qq.com>
Author: ourongyime <9450915@qq.com>
Section: Tweaks
PKGEOF
          cat /tmp/Packages
          curl -s --retry 3 --connect-timeout 30 -T /tmp/Packages ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || true
          echo "=== Packages uploaded ==="