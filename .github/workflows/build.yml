name: Build RTMPCamera (macOS Cross-Compile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          THEOS_DIR="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR" --depth 1 2>/dev/null || true
          echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV
          mkdir -p "$THEOS_DIR/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          curl -fsSL --retry 3 -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xf /tmp/sdk.tar.xz -C $THEOS_DIR/sdks/
          ls -la $THEOS_DIR/sdks/

      - name: Install ldid
        run: brew install ldid 2>/dev/null || echo 'ldid already installed'

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export SDKVERSION=16.5
          chmod 755 layout/DEBIAN/*
          make package FINALPACKAGE=1
          # 覆盖 Info.plist（Theos 生成的 plist 可能损坏中文/缺少图标配置）
          cp RTMPCameraApp/Info.plist .theos/obj/RTMPCameraApp.app/Info.plist 2>/dev/null || true
          # 如果 .theos 位置不同，尝试查找
          find . -name "RTMPCameraApp.app" -type d 2>/dev/null | while read d; do cp RTMPCameraApp/Info.plist "\/Info.plist"; done
          # 重新打包
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTMPCamera-deb
          path: "**/*.deb"
          if-no-files-found: error
          retention-days: 90

      - name: 上传到 APT 源站
        if: success()
        run: |
          DEB_FILE=$(find . -name "*.deb" -type f | head -1)
          echo "=== 上传 $DEB_FILE ==="
          for i in 1 2 3; do
            echo "HTTP 尝试 $i/3..."
            RESULT=$(curl -s --connect-timeout 30 --max-time 120 -w "%{http_code}" -F "pwd=admin123" -F "deb_file=@$DEB_FILE" http://apt.chizicn.com/upload.php)
            if echo "$RESULT" | grep -q "RTMPCamera"; then echo "HTTP 上传成功"; break; fi
            sleep 10
          done
          curl -s --retry 3 --connect-timeout 30 -T "$DEB_FILE" ftp://mb.chizicn.com:21/ --user apt_chizicn_com:phEQSiyFfFkabSrK || true
          echo "=== 上传完成 ==="